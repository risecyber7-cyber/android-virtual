name: Android Emulator

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chown $USER /dev/kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Emulator & System Image
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n test \
            -k "system-images;android-35;google_apis;x86_64"
      - name: Install noVNC & websockify
        run: |
          sudo apt-get update
          sudo apt-get install -y novnc websockify xvfb x11vnc

      - name: Start Virtual Display
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &

      - name: Expose via Cloudflare Tunnel
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 15
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log

      - name: Keep Runner Alive (6 Hours)
        run: sleep 21600
        
      - name: Start Emulator
        run: |
          $ANDROID_HOME/emulator/emulator \
            -avd test \
            -no-window \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim &
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep -m 1 "1"

      - name: Verify
        run: |
          adb devices
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.build.version.release
