name: Android Emulator Remote

on:
  workflow_dispatch:

jobs:
  emulator:
    name: Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISPLAY: ":99"
      ANDROID_AVD_HOME: ~/.android/avd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          sudo apt update
          sudo apt install -y qemu-kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Emulator
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name github \
            --package "system-images;android-35;google_apis;x86_64"

      - name: Install Remote Desktop Packages
        run: |
          sudo apt update
          sudo apt install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            wget

      - name: Install SSH Server
        run: |
          sudo apt install -y openssh-server
          sudo systemctl enable ssh

      - name: Configure SSH
        run: |
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          
          echo 'runner:Devaisback@' | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Start SSH Service
        run: |
          sudo service ssh start
          sudo service ssh status

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscaled --state=/tmp/tailscaled.state &
          sleep 5

      - name: Login to Tailscale
        run: |
          sudo tailscale up

      - name: Start X Server
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

      - name: Start Android Emulator
        run: |
          nohup $ANDROID_HOME/emulator/emulator \
            -avd github \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-audio \
            -camera-back none \
            -camera-front none \
            -memory 4096 \
            -cores 4 \
            > emulator.log 2>&1 &

      - name: Wait for Boot
        run: |
          sleep 60
          echo "Emulator boot wait complete"

      - name: Start VNC
        run: |
          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 &

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 localhost:5900 &

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64

      - name: Create Tunnel
        run: |
          ./cloudflared-linux-amd64 tunnel \
            --url http://localhost:6080 \
            > cloudflare.log 2>&1 &

          sleep 20

          echo "=============================="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare.log || true
          echo "=============================="

      - name: Show Connection Info
        run: |
          echo "=============================="
          echo "SSH Access Details:"
          echo "  User: runner"
          echo "  Password: Devaisback@"
          echo "  Port: 22"
          echo "=============================="
          echo "Tailscale IP:"
          tailscale ip -4 || true
          echo "=============================="

      - name: Keep Runner Alive
        run: |
          echo "Runner will stay alive for 6 hours..."
          sleep 21600
